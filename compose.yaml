services:
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - ./.data/tigerbeetle:/data
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1

  service:
    build: .
    restart: on-failure
    environment:
      HTTP_ADDRESS: :8080
      TB_CLUSTER_ID: "0"
      TB_ADDRESSES: tigerbeetle:3000
      TB_LEDGER_ID: "1"
      AUTHORIZATION_TIMEOUT: 1h
      RISK_EVALUATION_DELAY: 200ms
      RISK_AUTO_APPROVE_LIMIT_CENTS: "100000"
      MAX_CONCURRENT_REQUESTS: "4096"
    ports:
      - "8080:8080"
    depends_on:
      tigerbeetle:
        condition: service_started
